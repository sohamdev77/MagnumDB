[package]
name = "magnumdb"
version = "0.4.6"
edition = "2021"
authors = ["Soham Das <sohom2682009@gmail.com>"]
description = "High-performance embeddable database engine in Rust with B+ Tree storage, WAL durability, Volcano query engine, and Postgres wire protocol support."
license = "MIT"
repository = "https://github.com/sohamdev77/MagnumDB"
documentation = "https://docs.rs/magnumdb"
readme = "README.md"
keywords = ["database", "embedded", "btree", "sql", "storage-engine"]
categories = ["database-implementations", "database"]

[dependencies]
# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization and config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crc32fast = "1.4"

# Fast, non-cryptographic hash function for internal structures
ahash = "0.8"

# Concurrency primitives
parking_lot = "0.12"
crossbeam-utils = "0.8"
lru = "0.18.1"
tokio = { version = "1.36", features = ["full"] }
md5 = "0.8.1"
rand = "0.8.5"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
rand = "0.8.5"

[[bench]]
name = "storage_bench"
harness = false
